name: Deploy

# Every push to main builds the site and deploys it to Cloudflare.
# This is the only way the site gets deployed.
on:
  push:
    branches: [main]

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_BUCKET: sk-wairimu-images

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      - name: Create the R2 bucket if it does not exist
        run: |
          pnpm exec wrangler r2 bucket info "$R2_BUCKET" \
            || pnpm exec wrangler r2 bucket create "$R2_BUCKET"

      - name: Upload photos to R2
        run: sh scripts/upload-images.sh --remote

      - name: Deploy the Worker
        run: pnpm exec wrangler deploy
